<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nobar</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#09090c;color:#fff;font:14px system-ui,sans-serif}.wrap{padding:14px;max-width:960px;margin:auto}.card{background:#15151b;border:1px solid #282832;border-radius:18px;padding:14px;margin:10px 0}video{width:100%;background:#000;border-radius:14px;max-height:72vh;aspect-ratio:16/9;object-fit:contain}button,input{font:inherit}button{background:#282832;color:#fff;border:0;border-radius:12px;padding:10px 13px;margin:8px 5px 0 0;font-weight:700}button:disabled{opacity:.45}input[type=file]{width:100%;padding:12px;border:1px dashed #444;border-radius:12px;background:#101015;color:#fff}.muted{color:#9999a3;font-size:12px}.ok{color:#8ee6a7}.err{color:#ff8585}.bar{height:8px;background:#282832;border-radius:99px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;width:0;background:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.danger{background:#4a1d24}</style></head><body><div class="wrap"><div class="card"><div class="row"><b>🎬 Nobar</b><span id="role" class="muted">-</span></div><div id="title" class="muted">Memuat…</div></div><div class="card"><video id="v" controls playsinline preload="metadata"></video><div><button id="sync">🔄 Sinkronkan</button><button id="mode">↔️ Miring/Tegak</button></div><div id="st" class="muted">Menghubungkan…</div></div><div id="uploadCard" class="card hidden"><b>⬆️ Upload film</b><div class="muted">Maksimal 5 GiB. Upload langsung ke storage, jadi Railway tidak menampung file 5 GiB.</div><input id="file" type="file" accept="video/*,.mkv,.mp4,.webm,.mov,.m4v"><button id="up" disabled>Upload film</button><div class="bar"><i id="prog"></i></div><div id="upst" class="muted">Pilih file video.</div></div><div class="card"><span id="code">-</span> · <span id="members">0</span> penonton</div></div><script>
Telegram.WebApp.ready();Telegram.WebApp.expand();
const code=(new URLSearchParams(location.search).get('room')||'').toUpperCase(), qs=new URLSearchParams(location.search), v=document.querySelector('#v');
const headers={'X-Telegram-Init-Data':Telegram.WebApp.initData}; let mode=false,busy=false,host=false,filmReady=false,loadedFilm='';
const $=id=>document.getElementById(id); const setStatus=(t,c='')=>{$('st').textContent=t;$('st').className='muted '+c};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'Request gagal');return d}
async function loadFilm(){if(!filmReady||v.dataset.loaded==='1')return;const f=await api('/api/film/'+code);v.src=f.stream;v.dataset.loaded='1';loadedFilm=f.name;}
async function loadState(){if(!code)return;try{const r=await api('/api/room/'+code);host=r.is_host;filmReady=r.film_ready;$('title').textContent=r.title;$('code').textContent=code;$('members').textContent=r.members;$('role').textContent=host?'HOST':'PENONTON';$('uploadCard').classList.toggle('hidden',!host);if(r.film_ready){await loadFilm();if(v.readyState>=1&&!busy){let target=Number(r.position_seconds)||0,drift=target-v.currentTime;if(Math.abs(drift)>1.25)v.currentTime=target;if(r.is_playing&&v.paused)await v.play().catch(()=>{});if(!r.is_playing&&!v.paused)v.pause();}setStatus('Terhubung · '+(r.is_playing?'▶️ Playing':'⏸️ Paused'),'ok')}else setStatus(host?'Terhubung · upload film untuk mulai':'Menunggu host mengunggah film');}catch(e){setStatus(e.message,'err')}}
async function push(){if(!host||busy||!v.src)return;try{await api('/api/room/'+code+'/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({position:v.currentTime,playing:!v.paused})})}catch(e){setStatus(e.message,'err')}}
$('sync').onclick=async()=>{busy=true;try{await loadState()}finally{busy=false}};
v.onplay=push;v.onpause=push;v.onseeked=push;
$('mode').onclick=()=>{mode=!mode;v.style.aspectRatio=mode?'9/16':'16/9';$('mode').textContent=mode?'↕️ Tegak':'↔️ Miring'};
const file=$('file');file.onchange=()=>{$('up').disabled=!file.files.length;$('upst').textContent=file.files.length?file.files[0].name+' · '+(file.files[0].size/1024/1024/1024).toFixed(2)+' GiB':'Pilih file video.'};
const MAX=5*1024**3;
$('up').onclick=async()=>{const f=file.files[0];if(!f)return;if(f.size<=0||f.size>MAX){$('upst').textContent='❌ Maksimal 5 GiB.';return}$('up').disabled=true;busy=true;let filmId=null;try{const init=await api('/api/upload/init/'+code,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.name,size:f.size,content_type:f.type||'video/mp4'})});filmId=init.film_id;$('upst').textContent='Mempersiapkan '+init.parts.length+' part…';const done=[];let next=0,completed=0;const workers=4;async function worker(){while(true){const idx=next++;if(idx>=init.parts.length)return;const p=init.parts[idx];let ok=false,last='';for(let attempt=1;attempt<=3&&!ok;attempt++){try{const start=(p.part_number-1)*init.part_size,end=Math.min(start+init.part_size,f.size);const r=await fetch(p.url,{method:'PUT',body:f.slice(start,end)});if(!r.ok)throw new Error('HTTP '+r.status);const etag=r.headers.get('ETag');if(!etag)throw new Error('ETag tidak tersedia; cek CORS R2');done.push({PartNumber:p.part_number,ETag:etag});ok=true;completed++;$('prog').style.width=(completed/init.parts.length*100).toFixed(1)+'%';$('upst').textContent='Upload '+Math.floor(completed/init.parts.length*100)+'% · part '+completed+'/'+init.parts.length}catch(e){last=e.message;await new Promise(x=>setTimeout(x,1000*attempt))}}if(!ok)throw new Error('Part '+p.part_number+' gagal: '+last)} }await Promise.all(Array.from({length:workers},worker));await api('/api/upload/complete/'+code,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({film_id:filmId,parts:done})});$('upst').textContent='✅ Film siap diputar.';$('prog').style.width='100%';v.removeAttribute('src');v.dataset.loaded='';filmReady=true;await loadState()}catch(e){$('upst').textContent='❌ '+e.message;if(filmId)try{await api('/api/upload/abort/'+code,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({film_id:filmId})})}catch{} }finally{busy=false;$('up').disabled=false}};
if(!code)setStatus('Kode room tidak ada','err');loadState();setInterval(()=>{if(!busy)loadState()},1000);
</script></body></html>
